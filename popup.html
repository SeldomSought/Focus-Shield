<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:300px;background:#08080c;color:#e7e9ea;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}

.hdr{padding:14px 16px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(255,255,255,.07)}
.hdr-dot{width:8px;height:8px;border-radius:50%}
.hdr-name{font-size:14px;font-weight:800;letter-spacing:-.3px}
.hdr-ver{font-size:10px;color:#536471;margin-left:auto}

.timer-sec{padding:20px 16px;text-align:center;border-bottom:1px solid rgba(255,255,255,.07)}
.time-big{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;margin-bottom:6px}
.status{font-size:11px;color:#71767b;margin-bottom:14px;min-height:16px}
.btns{display:flex;gap:8px;justify-content:center}
.btn{padding:8px 20px;border-radius:18px;border:none;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-start{background:#4ade80;color:#000}.btn-start:hover{background:#22c55e}
.btn-stop{background:rgba(255,255,255,.08);color:#e7e9ea}.btn-stop:hover{background:rgba(255,255,255,.13)}
.btn:disabled{opacity:.35;cursor:not-allowed}

.sec{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.sec-label{font-size:10px;font-weight:700;color:#536471;letter-spacing:.7px;margin-bottom:8px}

.row{display:flex;align-items:center;justify-content:space-between}
.row-text{font-size:12px;font-weight:600}
.row-sub{font-size:10px;color:#536471;margin-top:1px}

.sw{position:relative;width:34px;height:18px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sl{position:absolute;inset:0;background:#333;border-radius:18px;cursor:pointer;transition:.2s}
.sl:before{content:"";position:absolute;height:14px;width:14px;left:2px;bottom:2px;background:#fff;border-radius:50%;transition:.2s}
input:checked+.sl{background:#4ade80}
input:checked+.sl:before{transform:translateX(16px)}

.limit-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.chip{padding:5px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:transparent;color:#71767b;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.chip.on{background:rgba(74,222,128,.12);border-color:#4ade80;color:#4ade80}

.footer{padding:10px 16px}
.btn-reset{width:100%;padding:7px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:transparent;color:#536471;font-size:11px;cursor:pointer;transition:all .15s}
.btn-reset:hover{color:#e7e9ea;border-color:rgba(255,255,255,.2)}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-dot" id="hdrDot" style="background:#71767b"></div>
  <span class="hdr-name">Focus Shield</span>
  <span class="hdr-ver">v3.0</span>
</div>

<div class="timer-sec">
  <div class="time-big" id="timeDisplay">30:00</div>
  <div class="status" id="statusText">Loading…</div>
  <div class="btns">
    <button class="btn btn-start" id="btnStart">▶ Start Session</button>
    <button class="btn btn-stop" id="btnStop" style="display:none">■ Stop</button>
  </div>
</div>

<div class="sec">
  <div class="sec-label">PROTECTION</div>
  <div class="row">
    <div>
      <div class="row-text">Focus Shield enabled</div>
      <div class="row-sub">Blocks feeds when no session is active</div>
    </div>
    <label class="sw"><input type="checkbox" id="toggleFocus" checked><span class="sl"></span></label>
  </div>
</div>

<div class="sec">
  <div class="sec-label">DAILY LIMIT</div>
  <div class="limit-row" id="limitChips"></div>
</div>

<div class="footer">
  <button class="btn-reset" id="btnReset">Reset today's budget (testing)</button>
</div>

<script src="popup.js"></script>
</body>
</html>
